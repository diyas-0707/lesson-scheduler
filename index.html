<style>
  :root, html[data-theme="manuscript"] {
    --paper: #F5F1E8; --paper-raised: #FBF9F4; --ink: #22252B; --ink-soft: #5A5E67;
    --brass: #B8935A; --brass-deep: #8C6D3F; --slate: #4B5C78; --sage: #5F8562;
    --rule: rgba(34, 37, 43, 0.14); --rule-light: rgba(34, 37, 43, 0.08);
    --shadow: 0 1px 2px rgba(34,37,43,0.06), 0 8px 24px rgba(34,37,43,0.05);
  }
  html[data-theme="slate"] {
    --paper: #EAEEF3; --paper-raised: #F6F8FA; --ink: #1E2733; --ink-soft: #56626F;
    --brass: #3D6E91; --brass-deep: #2A4E68; --slate: #6B5B95; --sage: #3F7A6B;
    --rule: rgba(30, 39, 51, 0.14); --rule-light: rgba(30, 39, 51, 0.08);
    --shadow: 0 1px 2px rgba(30,39,51,0.06), 0 8px 24px rgba(30,39,51,0.05);
  }
  html[data-theme="forest"] {
    --paper: #EEF2E7; --paper-raised: #F8FAF4; --ink: #242A1E; --ink-soft: #5B6350;
    --brass: #6E8C3F; --brass-deep: #4E682C; --slate: #3F6B5C; --sage: #8B7B3E;
    --rule: rgba(36, 42, 30, 0.14); --rule-light: rgba(36, 42, 30, 0.08);
    --shadow: 0 1px 2px rgba(36,42,30,0.06), 0 8px 24px rgba(36,42,30,0.05);
  }
  html[data-theme="rosewood"] {
    --paper: #F5EAE6; --paper-raised: #FCF5F3; --ink: #2E2124; --ink-soft: #6B5458;
    --brass: #A65A5F; --brass-deep: #7D3F44; --slate: #6B5A7D; --sage: #7D8F6B;
    --rule: rgba(46, 33, 36, 0.14); --rule-light: rgba(46, 33, 36, 0.08);
    --shadow: 0 1px 2px rgba(46,33,36,0.06), 0 8px 24px rgba(46,33,36,0.05);
  }
  html[data-theme="sunset"] {
    --paper: #FBEEE0; --paper-raised: #FFF8EF; --ink: #33241A; --ink-soft: #7A5D4A;
    --brass: #D97B3F; --brass-deep: #B25A24; --slate: #5C6B8C; --sage: #6E8F5F;
    --rule: rgba(51, 36, 26, 0.14); --rule-light: rgba(51, 36, 26, 0.08);
    --shadow: 0 1px 2px rgba(51,36,26,0.06), 0 8px 24px rgba(51,36,26,0.05);
  }
  html[data-theme="lavender"] {
    --paper: #EFEBF5; --paper-raised: #F8F6FB; --ink: #2C2438; --ink-soft: #6B5F7A;
    --brass: #8B6FA8; --brass-deep: #6B4F87; --slate: #5C6B8C; --sage: #6E8F7D;
    --rule: rgba(44, 36, 56, 0.14); --rule-light: rgba(44, 36, 56, 0.08);
    --shadow: 0 1px 2px rgba(44,36,56,0.06), 0 8px 24px rgba(44,36,56,0.05);
  }
  html[data-theme="grey"] {
    --paper: #EBEBED; --paper-raised: #F7F7F8; --ink: #202024; --ink-soft: #5C5C63;
    --brass: #57565F; --brass-deep: #3F3E46; --slate: #71717A; --sage: #6E8F6B;
    --rule: rgba(32, 32, 36, 0.14); --rule-light: rgba(32, 32, 36, 0.08);
    --shadow: 0 1px 2px rgba(32,32,36,0.06), 0 8px 24px rgba(32,32,36,0.05);
  }
  html[data-theme="white"] {
    --paper: #FFFFFF; --paper-raised: #F0F0F0; --ink: #333333; --ink-soft: #737373;
    --brass: #4D4D4D; --brass-deep: #2B2B2B; --slate: #666666; --sage: #595959;
    --rule: rgba(0, 0, 0, 0.12); --rule-light: rgba(0, 0, 0, 0.06);
    --shadow: 0 1px 2px rgba(0,0,0,0.05), 0 8px 24px rgba(0,0,0,0.04);
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, .display { font-family: 'Spectral', Georgia, serif; font-weight: 500; letter-spacing: -0.01em; margin: 0; }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .staff { width: 56px; height: 18px; margin: 10px auto 0; }
  .staff line { stroke: var(--brass); stroke-width: 1; }
  .app-logo { width: 128px; height: 128px; object-fit: cover; border-radius: 20px; box-shadow: var(--shadow); border: 1px solid var(--rule-light); margin-bottom: 4px; }
  .center { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; gap: 4px; text-align: center; }
  .app-shell { max-width: 430px; margin: 0 auto; padding: 28px 20px 60px; min-height: 100vh; }

  .topbar { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .topbar h1 { font-size: 24px; }
  .hamburger-btn {
    background: transparent; border: 1px solid var(--rule); border-radius: 8px;
    width: 38px; height: 38px; padding: 0; display: flex; align-items: center; justify-content: center;
    color: var(--ink); font-size: 16px; flex-shrink: 0;
  }
  .hamburger-btn:hover { background: var(--rule-light); }

  .drawer-overlay { position: fixed; inset: 0; background: rgba(20, 22, 26, 0.4); z-index: 40; }
  .drawer-panel {
    position: fixed; top: 0; left: 0; bottom: 0; width: 230px; background: var(--paper-raised);
    box-shadow: 6px 0 28px rgba(0,0,0,0.18); z-index: 41; padding: 18px 14px; display: flex; flex-direction: column; gap: 4px;
  }
  .drawer-panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--brass-deep); margin: 4px 0 12px; }
  .drawer-close { align-self: flex-end; background: transparent; border: none; color: var(--ink-soft); font-size: 18px; padding: 4px 8px; margin-bottom: 4px; }
  .drawer-tab {
    text-align: left; background: transparent; border: none; padding: 11px 12px; border-radius: 8px;
    color: var(--ink); font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 14px;
  }
  .drawer-tab:hover { background: var(--rule-light); }
  .drawer-tab.active { background: var(--brass-deep); color: #FFF9EF; }

  button { cursor: pointer; border: none; border-radius: 8px; padding: 11px 18px; background: var(--ink); color: var(--paper-raised); font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 0.01em; transition: transform 0.12s ease, background 0.12s ease; }
  button:hover { background: var(--slate); }
  button:active { transform: scale(0.98); }
  button.primary { background: var(--brass-deep); color: #FFF9EF; }
  button.primary:hover { background: var(--brass); }
  button.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--rule); padding: 9px 16px; }
  button.ghost:hover { background: var(--rule-light); color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  button.danger { background: #A94438; color: #FFF6F4; }
  button.danger:hover { background: #8C372D; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .danger-link { background: transparent; color: #A94438; border: none; padding: 6px 0; font-size: 13px; text-decoration: underline; font-weight: 500; }
  .danger-link:hover { background: transparent; color: #8C372D; }
  .danger-confirm { border: 1px solid rgba(169, 68, 56, 0.35); background: rgba(169, 68, 56, 0.06); border-radius: 10px; padding: 14px; margin-top: 8px; }
  .danger-confirm p { color: var(--ink); font-size: 13px; margin: 0 0 10px; }
  input, select { font-family: 'Manrope', sans-serif; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--rule); background: var(--paper-raised); color: var(--ink); font-size: 14px; }
  input::placeholder { color: var(--ink-soft); }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
  section, .card { background: var(--paper-raised); border: 1px solid var(--rule-light); border-radius: 14px; padding: 18px 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow); }
  section h2, .card h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--brass-deep); font-family: 'Manrope', sans-serif; font-weight: 700; margin: 0 0 12px; }
  section p { color: var(--ink-soft); font-size: 14px; line-height: 1.5; margin: 0 0 10px; }
  .invite-code { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; letter-spacing: 0.12em; background: var(--paper); border: 1px dashed var(--brass); border-radius: 8px; padding: 8px 16px; color: var(--brass-deep); }
  .student-row, .request-card { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--rule-light); font-size: 14px; }
  .student-row:last-child, .request-card:last-child { border-bottom: none; }
  .request-card { flex-direction: column; align-items: flex-start; gap: 8px; }
  .request-card > div { display: flex; gap: 8px; }
  .error { color: #A94438; font-size: 13px; margin-top: 8px; }
  .ok { color: var(--sage); font-size: 13px; margin-top: 8px; }
  .slot-chip { display: inline-flex; margin: 4px 6px 0 0; background: var(--paper); border: 1px solid var(--sage); color: var(--sage); font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 7px 12px; white-space: nowrap; }
  .slot-chip:hover { background: var(--sage); color: #fff; }
  .slot-chip:disabled { border-color: var(--rule); color: var(--ink-soft); background: transparent; }
  form.inline { display: flex; gap: 8px; flex-wrap: wrap; }
  .divider-text { margin: 14px 0 6px; font-size: 13px; color: var(--ink-soft); }
  .current-slot { font-family: 'JetBrains Mono', monospace; color: var(--slate); font-size: 15px; margin: 0 0 6px; }

  .day-pills { display: flex; gap: 8px; margin: 4px 0 14px; }
  .day-pill {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 500;
    background: var(--paper); color: var(--ink-soft);
    border: 1px solid var(--rule); padding: 0; cursor: pointer;
  }
  .day-pill:hover { background: var(--rule-light); color: var(--ink); }
  .day-pill.selected { background: var(--brass-deep); color: #FFF9EF; border-color: var(--brass-deep); }
  .day-pill.selected:hover { background: var(--brass); }
  .day-pill.disabled { opacity: 0.3; cursor: not-allowed; }
  .day-pill.disabled:hover { background: var(--paper); color: var(--ink-soft); }

  .detail-arrow {
    background: transparent; color: var(--brass-deep); border: 1px solid var(--rule);
    border-radius: 50%; width: 22px; height: 22px; padding: 0;
    font-size: 15px; line-height: 1; display: flex; align-items: center; justify-content: center;
  }
  .detail-arrow:hover { background: var(--brass-deep); color: #FFF9EF; border-color: var(--brass-deep); }

  .theme-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.15); }
  .theme-dropdown-toggle {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 12px;
    border: 1px solid var(--rule); border-radius: 8px; background: var(--paper-raised);
    color: var(--ink); font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 600;
  }
  .theme-dropdown-toggle:hover { background: var(--rule-light); }
  .theme-dropdown-panel {
    position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; width: 100%;
    background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 8px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .theme-dropdown-item {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 9px 12px;
    background: transparent; border: none; border-radius: 0; color: var(--ink);
    font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 500; text-align: left;
  }
  .theme-dropdown-item:hover { background: var(--rule-light); }
  .theme-dropdown-item.active { background: var(--rule-light); font-weight: 700; }

  .calendar-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .calendar-nav { display: flex; align-items: center; gap: 6px; }
  .calendar-nav-btn { width: 32px; height: 32px; padding: 0; border-radius: 8px; background: var(--paper-raised); color: var(--ink); border: 1px solid var(--rule); font-size: 14px; }
  .calendar-nav-btn:hover { background: var(--rule-light); }
  .calendar-range-label { font-family: 'Manrope', sans-serif; font-size: 14px; font-weight: 700; color: var(--ink); min-width: 130px; text-align: center; }
  .calendar-view-toggle { display: flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
  .calendar-view-toggle button { border-radius: 0; padding: 7px 12px; font-size: 12px; background: var(--paper-raised); color: var(--ink-soft); }
  .calendar-view-toggle button.active { background: var(--brass-deep); color: #FFF9EF; }
  .calendar-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-soft); margin-bottom: 14px; }
  .reschedule-banner {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--brass-deep); color: #FFF9EF; border-radius: 10px; padding: 10px 14px;
    font-size: 13px; font-weight: 600; margin-bottom: 14px;
  }
  .reschedule-banner button { padding: 6px 12px; font-size: 12px; background: rgba(255,255,255,0.18); color: #FFF9EF; border: 1px solid rgba(255,255,255,0.4); }
  .reschedule-banner button:hover { background: rgba(255,255,255,0.28); }
  .calendar-block.free[data-date] { cursor: pointer; }
  .calendar-block.free[data-date]:hover { background: var(--sage); color: #fff; }
  .calendar-legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend-dot { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

  .calendar-week-list { display: flex; flex-direction: column; gap: 8px; }
  .calendar-day-row {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--paper-raised); border: 1px solid var(--rule-light); border-radius: 10px; padding: 10px;
  }
  .calendar-day-row.today { border-color: var(--brass-deep); }
  .calendar-day-label { flex-shrink: 0; width: 46px; font-family: 'Manrope', sans-serif; font-weight: 600; font-size: 11px; color: var(--ink-soft); text-align: center; padding-top: 2px; }
  .calendar-day-label b { display: block; color: var(--ink); font-size: 13px; margin-top: 2px; }
  .calendar-day-blocks { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-height: 22px; }
  .calendar-day-blocks:empty::after { content: '—'; color: var(--ink-soft); font-size: 12px; padding-top: 2px; }
  .calendar-block { border-radius: 6px; padding: 4px 8px; font-size: 11px; line-height: 1.4; color: #fff; white-space: normal; overflow-wrap: break-word; word-break: break-word; max-width: 160px; }
  .calendar-block.unavailable { background: #9aa0a8; color: #fff; }
  .calendar-block.student-unavailable { background: #C48E93; color: #fff; }
  .calendar-block.free { background: transparent; border: 1px dashed var(--sage); color: var(--sage); }
  .calendar-block.conflict { box-shadow: inset 0 0 0 2px #A94438; }

  .calendar-month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .calendar-month-cell { background: var(--paper-raised); border: 1px solid var(--rule-light); border-radius: 8px; padding: 5px; min-height: 62px; font-size: 10px; }
  .calendar-month-cell.other-month { opacity: 0.35; }
  .calendar-month-cell.today { border-color: var(--brass-deep); }
  .calendar-month-daynum { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; }
  .calendar-month-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin: 1px; }

  .day-detail-overlay { position: fixed; inset: 0; background: rgba(20, 22, 26, 0.4); z-index: 42; }
  .day-detail-panel {
    position: fixed; left: 16px; right: 16px; bottom: 16px; max-width: 400px; margin: 0 auto;
    max-height: 70vh; overflow-y: auto; background: var(--paper-raised); border-radius: 14px;
    box-shadow: 0 10px 36px rgba(0,0,0,0.28); z-index: 43; padding: 18px;
  }
  .day-detail-panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .day-detail-event { padding: 9px 0; border-bottom: 1px solid var(--rule-light); font-size: 14px; }
  .day-detail-event:last-child { border-bottom: none; }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
  deleteUser, reauthenticateWithPopup
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection,
  onSnapshot, query, where, serverTimestamp, writeBatch, getDocs
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

// TODO: replace with this project's own Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyAQm_jCLFWm8snbs0jCOOWP6AYMiSbhuaY",
  authDomain: "lesson-scheduler-bd50c.firebaseapp.com",
  projectId: "lesson-scheduler-bd50c",
  storageBucket: "lesson-scheduler-bd50c.firebasestorage.app",
  messagingSenderId: "167821025290",
  appId: "1:167821025290:web:6e5729288b71abe6c5bff3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();

const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_LETTERS = ['S','M','T','W','T','F','S'];
const FULL_DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TEACHER_TABS = [
  { id: 'home', label: 'Home' },
  { id: 'calendar', label: 'Calendar' },
  { id: 'students', label: 'Students' },
  { id: 'schedule', label: 'Schedule' },
  { id: 'settings', label: 'Settings' }
];
const STUDENT_TABS = [
  { id: 'home', label: 'Home' },
  { id: 'calendar', label: 'Calendar' },
  { id: 'schedule', label: 'Schedule' },
  { id: 'settings', label: 'Settings' }
];
const THEMES = [
  { id: 'rosewood', label: 'Rosewood', dot: '#A65A5F' },
  { id: 'sunset', label: 'Sunset', dot: '#D97B3F' },
  { id: 'manuscript', label: 'Manuscript', dot: '#B8935A' },
  { id: 'forest', label: 'Forest', dot: '#6E8C3F' },
  { id: 'slate', label: 'Slate', dot: '#3D6E91' },
  { id: 'lavender', label: 'Lavender', dot: '#8B6FA8' },
  { id: 'grey', label: 'Grey', dot: '#57565F' },
  { id: 'white', label: 'White', dot: '#FFFFFF' }
];
const STUDENT_COLORS = ['#8C6D3F', '#3D6E91', '#6E8C3F', '#8B5FA0', '#B0555A', '#4E8C7A', '#A0763F'];

const el = document.getElementById('app');

let state = {
  user: null, profile: null, loading: true, unsubs: [],
  teacherViewingStudent: null, activeTab: null, drawerOpen: false,
  calendarView: 'week', calendarWeekStart: null, calendarMonthAnchor: null
};

function clearUnsubs() {
  state.unsubs.forEach((u) => u());
  state.unsubs = [];
}

function applyTheme() {
  const theme = (state.profile && state.profile.theme) || 'manuscript';
  document.documentElement.setAttribute('data-theme', theme);
}

function staffSvg() {
  return `<svg class="staff" viewBox="0 0 56 18" aria-hidden="true">
    <line x1="0" y1="1" x2="56" y2="1" />
    <line x1="0" y1="5" x2="56" y2="5" />
    <line x1="0" y1="9" x2="56" y2="9" />
    <line x1="0" y1="13" x2="56" y2="13" />
    <line x1="0" y1="17" x2="56" y2="17" />
  </svg>`;
}

function topbarHtml(title) {
  return `
    <div class="topbar">
      <button class="hamburger-btn" onclick="window.openDrawer()">☰</button>
      <h1 class="display">${title}</h1>
    </div>`;
}

function renderDrawer() {
  if (!state.drawerOpen) return '';
  const tabs = state.profile.role === 'teacher' ? TEACHER_TABS : STUDENT_TABS;
  return `
    <div class="drawer-overlay" onclick="window.closeDrawer()"></div>
    <div class="drawer-panel">
      <button class="drawer-close" onclick="window.closeDrawer()">✕</button>
      <h2>Menu</h2>
      ${tabs.map((t) => `<button class="drawer-tab ${state.activeTab === t.id ? 'active' : ''}" onclick="window.switchTab('${t.id}')">${t.label}</button>`).join('')}
    </div>`;
}

window.openDrawer = function () { state.drawerOpen = true; render(); };
window.closeDrawer = function () { state.drawerOpen = false; render(); };
window.switchTab = function (tabId) { state.activeTab = tabId; state.drawerOpen = false; render(); };

function timeToMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}
function minutesToTime(mins) {
  const h = String(Math.floor(mins / 60)).padStart(2, '0');
  const m = String(mins % 60).padStart(2, '0');
  return `${h}:${m}`;
}

/** Displays a stored 24-hour "HH:MM" as 12-hour with AM/PM. Storage,
 *  sorting, and comparisons stay in 24-hour — only display changes. */
function formatTime12(t) {
  if (!t) return t;
  const [hStr, mStr] = t.split(':');
  let h = parseInt(hStr, 10);
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if (h === 0) h = 12;
  return `${h}:${mStr} ${ampm}`;
}

/** Next calendar date (today included) matching the given weekday. */
function nextOccurrenceDate(dayOfWeek) {
  const now = new Date();
  const diff = (dayOfWeek - now.getDay() + 7) % 7;
  return new Date(now.getFullYear(), now.getMonth(), now.getDate() + diff);
}

function formatUpcomingLessonLine(dayOfWeek, startTime) {
  const d = nextOccurrenceDate(dayOfWeek);
  const dateStr = `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;
  return `Lesson on ${FULL_DAYS[dayOfWeek]}, ${dateStr} at ${formatTime12(startTime)}`;
}

/** Turns the teacher's weekly teaching window into individual bookable
 *  recurring slots (unavailable dates are one-off exceptions, shown
 *  separately, and don't remove a slot from the permanent weekly pool). */
function generateCandidateSlots(weeklySchedule) {
  if (!weeklySchedule || !weeklySchedule.activeDays || !weeklySchedule.activeDays.length) return [];
  const slotLen = weeklySchedule.slotLengthMinutes || 30;
  const startMin = timeToMinutes(weeklySchedule.startTime || '15:00');
  const endMin = timeToMinutes(weeklySchedule.endTime || '18:00');
  const slots = [];
  for (const day of weeklySchedule.activeDays) {
    for (let cursor = startMin; cursor + slotLen <= endMin; cursor += slotLen) {
      slots.push({ dayOfWeek: day, startTime: minutesToTime(cursor) });
    }
  }
  return slots;
}

// ---------- Calendar helpers ----------
function startOfWeek(d) {
  const copy = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  copy.setDate(copy.getDate() - copy.getDay());
  return copy;
}
function addDays(d, n) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}
function isoDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function isSameDate(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function colorForStudent(studentId) {
  let hash = 0;
  for (let i = 0; i < studentId.length; i++) hash = (hash * 31 + studentId.charCodeAt(i)) % STUDENT_COLORS.length;
  return STUDENT_COLORS[Math.abs(hash)];
}

/** Collapses back-to-back free slots (e.g. 3:00, 3:30, 4:00...) into a
 *  single range (3:00–4:30), breaking into separate ranges wherever a
 *  taken slot interrupts the sequence. Expects slots pre-sorted by time. */
function mergeFreeRanges(sortedFreeSlots, slotLenMinutes) {
  const ranges = [];
  let rangeStartMin = null;
  let rangeEndMin = null;
  sortedFreeSlots.forEach((s) => {
    const startMin = timeToMinutes(s.startTime);
    if (rangeStartMin === null) {
      rangeStartMin = startMin;
      rangeEndMin = startMin + slotLenMinutes;
    } else if (startMin === rangeEndMin) {
      rangeEndMin = startMin + slotLenMinutes;
    } else {
      ranges.push({ startTime: minutesToTime(rangeStartMin), endTime: minutesToTime(rangeEndMin) });
      rangeStartMin = startMin;
      rangeEndMin = startMin + slotLenMinutes;
    }
  });
  if (rangeStartMin !== null) ranges.push({ startTime: minutesToTime(rangeStartMin), endTime: minutesToTime(rangeEndMin) });
  return ranges;
}

/** Very compact time for narrow calendar blocks, e.g. "3p", "3:30p". */
function formatTimeCompact(t) {
  if (!t) return t;
  const [hStr, mStr] = t.split(':');
  let h = parseInt(hStr, 10);
  const ampm = h >= 12 ? 'p' : 'a';
  h = h % 12;
  if (h === 0) h = 12;
  return mStr === '00' ? `${h}${ampm}` : `${h}:${mStr}${ampm}`;
}

function rangesOverlap(aStartMin, aEndMin, bStartMin, bEndMin) {
  return aStartMin < bEndMin && bStartMin < aEndMin;
}

// ---------- Connection helpers ----------
function generateInviteCode() {
  return Math.random().toString(36).slice(2, 8).toUpperCase();
}

async function connectStudentToTeacher(code) {
  const q = query(collection(db, 'users'), where('inviteCode', '==', code));
  const results = await getDocs(q);
  if (results.empty) throw new Error('No teacher found with that invite code.');
  const teacherId = results.docs[0].id;
  await updateDoc(doc(db, 'users', state.user.uid), { teacherId, role: 'student' });
  await setDoc(doc(db, 'users', teacherId, 'students', state.user.uid), {
    studentId: state.user.uid, name: state.profile.name, email: state.profile.email,
    recurringSlot: null, connectedAt: new Date()
  });
  return teacherId;
}

async function requestConnectionByEmail(fromRole, toEmail) {
  const email = toEmail.trim().toLowerCase();

  if (fromRole === 'teacher') {
    if (email === state.profile.email.toLowerCase()) throw new Error("That's your own email.");
    await addDoc(collection(db, 'connectionRequests'), {
      teacherId: state.user.uid, teacherName: state.profile.name, teacherEmail: state.profile.email,
      studentId: null, studentName: null, studentEmail: email,
      initiatedBy: 'teacher', status: 'pending', createdAt: serverTimestamp()
    });
    return;
  }

  const q = query(collection(db, 'users'), where('email', '==', toEmail.trim()));
  const results = await getDocs(q);
  if (results.empty) throw new Error("No teacher account found with that email.");
  const toSnap = results.docs[0];
  const toUid = toSnap.id;
  const toData = toSnap.data();
  if (toUid === state.user.uid) throw new Error("That's your own email.");

  await addDoc(collection(db, 'connectionRequests'), {
    studentId: state.user.uid, studentName: state.profile.name, studentEmail: state.profile.email,
    teacherId: toUid, teacherName: toData.name, teacherEmail: toData.email,
    initiatedBy: 'student', status: 'pending', createdAt: serverTimestamp()
  });
}

async function acceptConnectionRequest(requestId, request) {
  const studentId = request.studentId || state.user.uid;
  const studentName = request.studentName || state.profile.name;
  const studentEmail = request.studentEmail || state.profile.email;
  const teacherId = request.teacherId;

  await updateDoc(doc(db, 'users', studentId), { teacherId, role: 'student' });
  await setDoc(doc(db, 'users', teacherId, 'students', studentId), {
    studentId, name: studentName, email: studentEmail, recurringSlot: null, connectedAt: new Date()
  });
  await updateDoc(doc(db, 'connectionRequests', requestId), { status: 'accepted', studentId });
}

async function rejectConnectionRequest(requestId) {
  await updateDoc(doc(db, 'connectionRequests', requestId), { status: 'rejected' });
}

// ---------- Reschedule logic ----------
const DEFAULT_CUTOFF_HOURS = 48;

function hoursUntil(lessonDate, lessonStartTime) {
  const lessonDateTime = new Date(`${lessonDate}T${lessonStartTime}:00`);
  return (lessonDateTime.getTime() - Date.now()) / (1000 * 60 * 60);
}

async function requestReschedule({ teacherId, studentId, studentName, lessonId, fromDate, fromStartTime, toDate, toStartTime }) {
  const teacherSnap = await getDoc(doc(db, 'users', teacherId));
  const cutoffHours = teacherSnap.data()?.rescheduleCutoffHours ?? DEFAULT_CUTOFF_HOURS;
  const hoursAway = hoursUntil(fromDate, fromStartTime);
  const withinCutoff = hoursAway < cutoffHours;
  const lessonRef = doc(db, 'users', teacherId, 'lessons', lessonId);

  if (withinCutoff) {
    await updateDoc(lessonRef, { status: 'pending_reschedule' });
    await addDoc(collection(db, 'users', teacherId, 'rescheduleRequests'), {
      studentId, studentName, lessonId, fromDate, toDate, toStartTime,
      requestedAt: serverTimestamp(), status: 'pending'
    });
    return { autoApplied: false };
  }
  await updateDoc(lessonRef, { date: toDate, startTime: toStartTime, originalDate: fromDate, status: 'confirmed' });
  return { autoApplied: true };
}

async function respondToRequest(teacherId, requestId, approve) {
  const requestRef = doc(db, 'users', teacherId, 'rescheduleRequests', requestId);
  const snap = await getDoc(requestRef);
  const req = snap.data();
  const lessonRef = doc(db, 'users', teacherId, 'lessons', req.lessonId);
  if (approve) {
    await updateDoc(lessonRef, { date: req.toDate, startTime: req.toStartTime, originalDate: req.fromDate, status: 'confirmed' });
  } else {
    await updateDoc(lessonRef, { status: 'confirmed' });
  }
  await updateDoc(requestRef, { status: approve ? 'approved' : 'denied' });
}

// ---------- One-off reschedule negotiation (either side flags a specific
// date's conflicting lesson; the two sides take turns proposing/confirming
// a new day and time for that occurrence only — the permanent weekly slot
// is untouched). Only one active negotiation per student at a time. ----------
function otherParty(party) { return party === 'teacher' ? 'student' : 'teacher'; }

function hasActiveProposal(proposalsForStudent) {
  return (proposalsForStudent || []).some((p) => p.status === 'active');
}

async function createRescheduleProposal(teacherId, studentId, originalDate, originalStartTime, requestedBy, proposedDate, proposedStartTime) {
  await addDoc(collection(db, 'users', teacherId, 'students', studentId, 'rescheduleProposals'), {
    requestedBy, originalDate, originalStartTime,
    status: 'active', mode: 'confirm', turnOwner: otherParty(requestedBy),
    proposedDate, proposedStartTime, proposedBy: requestedBy,
    createdAt: serverTimestamp()
  });
}

async function submitProposedTime(teacherId, studentId, proposalId, actingParty, date, time) {
  await updateDoc(doc(db, 'users', teacherId, 'students', studentId, 'rescheduleProposals', proposalId), {
    proposedDate: date, proposedStartTime: time, proposedBy: actingParty,
    mode: 'confirm', turnOwner: otherParty(actingParty)
  });
}

async function confirmProposedTime(teacherId, studentId, proposalId, accept) {
  if (accept) {
    await updateDoc(doc(db, 'users', teacherId, 'students', studentId, 'rescheduleProposals', proposalId), {
      status: 'confirmed', mode: null
    });
  } else {
    // Declining party now picks their own alternative — turnOwner stays on
    // them, just switches from confirming to picking.
    await updateDoc(doc(db, 'users', teacherId, 'students', studentId, 'rescheduleProposals', proposalId), {
      mode: 'pick'
    });
  }
}

// ---------- Account deletion ----------
async function deleteAccount() {
  const uid = state.user.uid;
  const batch = writeBatch(db);
  if (state.profile.role === 'teacher') {
    const subcollections = ['students', 'unavailableBlocks', 'lessons', 'rescheduleRequests'];
    for (const sub of subcollections) {
      const snap = await getDocs(collection(db, 'users', uid, sub));
      snap.forEach((d) => batch.delete(d.ref));
      if (sub === 'students') snap.forEach((d) => batch.update(doc(db, 'users', d.id), { teacherId: null }));
    }
  } else if (state.profile.role === 'student' && state.profile.teacherId) {
    batch.delete(doc(db, 'users', state.profile.teacherId, 'students', uid));
    const lessonsSnap = await getDocs(query(collection(db, 'users', state.profile.teacherId, 'lessons'), where('studentId', '==', uid)));
    lessonsSnap.forEach((d) => batch.delete(d.ref));
    const unavailSnap = await getDocs(collection(db, 'users', state.profile.teacherId, 'students', uid, 'unavailableDates'));
    unavailSnap.forEach((d) => batch.delete(d.ref));
    const proposalsSnap = await getDocs(collection(db, 'users', state.profile.teacherId, 'students', uid, 'rescheduleProposals'));
    proposalsSnap.forEach((d) => batch.delete(d.ref));
  }
  const asStudent = await getDocs(query(collection(db, 'connectionRequests'), where('studentId', '==', uid)));
  asStudent.forEach((d) => batch.delete(d.ref));
  const asTeacher = await getDocs(query(collection(db, 'connectionRequests'), where('teacherId', '==', uid)));
  asTeacher.forEach((d) => batch.delete(d.ref));
  batch.delete(doc(db, 'users', uid));
  await batch.commit();
  try {
    await deleteUser(auth.currentUser);
  } catch (err) {
    if (err.code === 'auth/requires-recent-login') {
      await reauthenticateWithPopup(auth.currentUser, googleProvider);
      await deleteUser(auth.currentUser);
    } else {
      throw err;
    }
  }
}

// ---------- Screens ----------
function render() {
  clearUnsubs();
  applyTheme();
  if (state.loading) { el.innerHTML = `<div class="center">Loading…</div>`; return; }
  if (!state.user) { renderLogin(); return; }
  if (!state.profile?.role) { renderChooseRole(); return; }
  if (!state.calendarWeekStart) state.calendarWeekStart = startOfWeek(new Date());
  if (!state.calendarMonthAnchor) { const t = new Date(); state.calendarMonthAnchor = new Date(t.getFullYear(), t.getMonth(), 1); }

  if (state.profile.role === 'teacher') {
    if (state.teacherViewingStudent) { renderStudentDetailView(); return; }
    if (!TEACHER_TABS.some((t) => t.id === state.activeTab)) state.activeTab = 'home';
    if (state.activeTab === 'students') { renderTeacherStudentsTab(); return; }
    if (state.activeTab === 'schedule') { renderTeacherScheduleTab(); return; }
    if (state.activeTab === 'settings') { renderSettingsTab(); return; }
    if (state.activeTab === 'calendar') { renderTeacherCalendarTab(); return; }
    renderTeacherHomeTab();
    return;
  }

  if (!STUDENT_TABS.some((t) => t.id === state.activeTab)) state.activeTab = 'home';
  if (state.activeTab === 'schedule') { renderStudentScheduleTab(); return; }
  if (state.activeTab === 'settings') { renderSettingsTab(); return; }
  if (state.activeTab === 'calendar') { renderStudentCalendarTab(); return; }
  renderStudentHomeTab();
}

window.calToday = function () {
  state.calendarWeekStart = startOfWeek(new Date());
  const t = new Date();
  state.calendarMonthAnchor = new Date(t.getFullYear(), t.getMonth(), 1);
  render();
};
window.calSetView = function (view) { state.calendarView = view; render(); };

function calendarToolbarHtml() {
  const weekEnd = addDays(state.calendarWeekStart, 6);
  const rangeLabel = state.calendarView === 'week'
    ? `${state.calendarWeekStart.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} – ${weekEnd.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`
    : state.calendarMonthAnchor.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
  return `
    <div class="calendar-toolbar">
      <div class="calendar-nav">
        <button class="calendar-nav-btn" onclick="window.${state.calendarView === 'week' ? 'calPrevWeek' : 'calPrevMonth'}()">‹</button>
        <span class="calendar-range-label">${rangeLabel}</span>
        <button class="calendar-nav-btn" onclick="window.${state.calendarView === 'week' ? 'calNextWeek' : 'calNextMonth'}()">›</button>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <button class="ghost" style="padding:6px 10px; font-size:12px;" onclick="window.calToday()">Today</button>
        <div class="calendar-view-toggle">
          <button class="${state.calendarView === 'week' ? 'active' : ''}" onclick="window.calSetView('week')">Week</button>
          <button class="${state.calendarView === 'month' ? 'active' : ''}" onclick="window.calSetView('month')">Month</button>
        </div>
      </div>
    </div>`;
}

function weekGridHtml(getBlocksForDate, onDayClick) {
  const today = new Date();
  let html = '<div class="calendar-week-list">';
  for (let i = 0; i < 7; i++) {
    const d = addDays(state.calendarWeekStart, i);
    const blocks = getBlocksForDate(d);
    const clickAttr = onDayClick ? ` onclick="${onDayClick(d)}" style="cursor:pointer;"` : '';
    html += `
      <div class="calendar-day-row ${isSameDate(d, today) ? 'today' : ''}"${clickAttr}>
        <div class="calendar-day-label">${DAY_LETTERS[d.getDay()]}<b>${d.getMonth() + 1}/${d.getDate()}</b></div>
        <div class="calendar-day-blocks">
          ${blocks.map((b) => {
            const typeClass = b.type === 'unavailable' ? 'unavailable' : (b.type === 'free' ? 'free' : (b.type === 'student-unavailable' ? 'student-unavailable' : ''));
            const dataAttrs = b.clickable ? ` data-date="${b.date}" data-starttime="${b.startTime}"` : '';
            return `<div class="calendar-block ${typeClass} ${b.conflict ? 'conflict' : ''}" style="${b.type === 'lesson' ? `background:${b.color};` : ''}"${dataAttrs}>${b.label}</div>`;
          }).join('')}
        </div>
      </div>`;
  }
  html += '</div>';
  return html;
}

window.calGoToWeekOf = function (iso) {
  const d = new Date(iso + 'T00:00:00');
  state.calendarWeekStart = startOfWeek(d);
  state.calendarView = 'week';
  render();
};

function monthGridHtml(getDotsForDate) {
  const anchor = state.calendarMonthAnchor;
  const firstOfMonth = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
  const gridStart = startOfWeek(firstOfMonth);
  const today = new Date();
  let html = '<div class="calendar-month-grid">';
  for (let i = 0; i < 42; i++) {
    const d = addDays(gridStart, i);
    const inMonth = d.getMonth() === anchor.getMonth();
    const dots = getDotsForDate(d);
    html += `
      <div class="calendar-month-cell ${inMonth ? '' : 'other-month'} ${isSameDate(d, today) ? 'today' : ''}" style="cursor:pointer;" onclick="window.calGoToWeekOf('${isoDate(d)}')">
        <div class="calendar-month-daynum">${d.getDate()}</div>
        <div>${dots.map((c) => `<span class="calendar-month-dot" style="background:${c};"></span>`).join('')}</div>
      </div>`;
  }
  html += '</div>';
  return html;
}

// ---------- Teacher: Calendar tab ----------
function renderTeacherCalendarTab() {
  el.innerHTML = `
    <div class="app-shell">
      ${topbarHtml('Calendar')}
      ${renderDrawer()}
      <div id="calendar-content"><p>Loading…</p></div>
    </div>`;

  const teacherId = state.user.uid;
  let students = [];
  let unavailableBlocks = [];
  let studentUnavailableMap = {};
  let studentUnavailListeners = {};
  let studentProposalsMap = {};
  let studentProposalListeners = {};
  let expandedDate = null;
  let reschedulingOrigin = null; // { studentId, date, startTime } while picking a new time

  function subscribeStudentExtras(studentId) {
    if (!studentUnavailListeners[studentId]) {
      const unsub = onSnapshot(collection(db, 'users', teacherId, 'students', studentId, 'unavailableDates'), (snap) => {
        studentUnavailableMap[studentId] = snap.docs.map((d) => d.data());
        draw();
      });
      studentUnavailListeners[studentId] = unsub;
      state.unsubs.push(unsub);
    }
    if (!studentProposalListeners[studentId]) {
      const unsub = onSnapshot(collection(db, 'users', teacherId, 'students', studentId, 'rescheduleProposals'), (snap) => {
        studentProposalsMap[studentId] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        draw();
      });
      studentProposalListeners[studentId] = unsub;
      state.unsubs.push(unsub);
    }
  }
  function unsubscribeStudentExtras(studentId) {
    if (studentUnavailListeners[studentId]) { studentUnavailListeners[studentId](); delete studentUnavailListeners[studentId]; delete studentUnavailableMap[studentId]; }
    if (studentProposalListeners[studentId]) { studentProposalListeners[studentId](); delete studentProposalListeners[studentId]; delete studentProposalsMap[studentId]; }
  }

  window.openDayDetail = function (iso) { expandedDate = iso; draw(); };
  window.closeDayDetail = function () { expandedDate = null; draw(); };

  window.startRescheduleSelection = function (studentId, originalDate, originalStartTime) {
    if (hasActiveProposal(studentProposalsMap[studentId])) return; // already one in flight
    reschedulingOrigin = { studentId, date: originalDate, startTime: originalStartTime };
    expandedDate = null;
    draw();
  };
  window.cancelRescheduleSelection = function () {
    reschedulingOrigin = null;
    draw();
  };
  window.finalizeRescheduleSelection = async function (newDate, newStartTime) {
    if (!reschedulingOrigin) return;
    const { studentId, date, startTime } = reschedulingOrigin;
    reschedulingOrigin = null;
    await createRescheduleProposal(teacherId, studentId, date, startTime, 'teacher', newDate, newStartTime);
    draw();
  };

  function draw() {
    const box = document.getElementById('calendar-content');
    if (!box) return;
    const ws = state.profile.weeklySchedule || { activeDays: [] };

    function isTakenByAnyone(dayOfWeek, startTime, excludeStudentId) {
      return students.some((s) => s.id !== excludeStudentId && s.recurringSlot &&
        s.recurringSlot.dayOfWeek === dayOfWeek && s.recurringSlot.startTime === startTime);
    }

    function blocksForDate(d, verbose) {
      const dow = d.getDay();
      const iso = isoDate(d);
      const blocks = [];
      if (ws.activeDays.includes(dow)) {
        students
          .filter((s) => s.recurringSlot && s.recurringSlot.dayOfWeek === dow)
          .sort((a, b) => a.recurringSlot.startTime.localeCompare(b.recurringSlot.startTime))
          .forEach((s) => {
            const proposals = studentProposalsMap[s.id] || [];
            const movedAway = proposals.some((p) => p.status === 'confirmed' && p.originalDate === iso);
            if (movedAway) return; // this occurrence was moved elsewhere, don't show it here

            const firstName = (s.name || '').split(' ')[0];
            const lessonStartMin = timeToMinutes(s.recurringSlot.startTime);
            const durationMin = s.recurringSlot.durationMinutes || 30;
            const lessonEndMin = lessonStartMin + durationMin;
            const conflict = (studentUnavailableMap[s.id] || [])
              .filter((u) => u.date === iso)
              .some((u) => rangesOverlap(lessonStartMin, lessonEndMin, timeToMinutes(u.startTime), timeToMinutes(u.endTime)));
            const active = proposals.find((p) => p.status === 'active');
            const suffix = active ? ' (reschedule in progress)' : '';
            const label = verbose
              ? `${conflict ? '⚠ Conflict — ' : ''}Lesson with ${s.name}, ${formatTime12(s.recurringSlot.startTime)}–${formatTime12(minutesToTime(lessonEndMin))}${suffix}`
              : `${conflict ? '⚠ ' : ''}${formatTimeCompact(s.recurringSlot.startTime)} ${firstName}`;
            blocks.push({
              type: 'lesson', color: colorForStudent(s.id), conflict, label,
              studentId: s.id, date: iso, startTime: s.recurringSlot.startTime,
              activeProposal: active || null
            });
          });
        students.forEach((s) => {
          const firstName = (s.name || '').split(' ')[0];
          (studentUnavailableMap[s.id] || []).filter((u) => u.date === iso).forEach((u) => {
            const label = verbose
              ? `${s.name} unavailable, ${formatTime12(u.startTime)}–${formatTime12(u.endTime)}`
              : `${firstName} out ${formatTimeCompact(u.startTime)}–${formatTimeCompact(u.endTime)}`;
            blocks.push({ type: 'student-unavailable', label });
          });
        });

        // While actively rescheduling, show open slots as clickable targets.
        if (reschedulingOrigin) {
          const slotLen = ws.slotLengthMinutes || 30;
          generateCandidateSlots(ws).filter((s) => s.dayOfWeek === dow).forEach((s) => {
            const taken = isTakenByAnyone(s.dayOfWeek, s.startTime, reschedulingOrigin.studentId);
            const blockedOut = unavailableBlocks.some((b) => b.date === iso &&
              rangesOverlap(timeToMinutes(s.startTime), timeToMinutes(s.startTime) + slotLen, timeToMinutes(b.startTime), timeToMinutes(b.endTime)));
            if (!taken && !blockedOut) {
              blocks.push({
                type: 'free', date: iso, startTime: s.startTime,
                label: verbose ? `Open — ${formatTime12(s.startTime)}` : formatTimeCompact(s.startTime),
                clickable: true
              });
            }
          });
        }
      }
      // Lessons that moved TO this date via a confirmed negotiation (may not
      // be this student's normal weekday at all — it's a one-off makeup).
      students.forEach((s) => {
        (studentProposalsMap[s.id] || [])
          .filter((p) => p.status === 'confirmed' && p.proposedDate === iso)
          .forEach((p) => {
            const firstName = (s.name || '').split(' ')[0];
            const durationMin = (s.recurringSlot && s.recurringSlot.durationMinutes) || 30;
            const endTime = minutesToTime(timeToMinutes(p.proposedStartTime) + durationMin);
            const label = verbose
              ? `Lesson with ${s.name} (rescheduled), ${formatTime12(p.proposedStartTime)}–${formatTime12(endTime)}`
              : `${formatTimeCompact(p.proposedStartTime)} ${firstName} (moved)`;
            blocks.push({ type: 'lesson', color: colorForStudent(s.id), label });
          });
      });
      unavailableBlocks.filter((b) => b.date === iso).forEach((b) => {
        const label = verbose
          ? `You're unavailable, ${formatTime12(b.startTime)}–${formatTime12(b.endTime)}`
          : `${formatTimeCompact(b.startTime)}–${formatTimeCompact(b.endTime)}`;
        blocks.push({ type: 'unavailable', label });
      });
      return blocks;
    }
    function dotsForDate(d) {
      const dow = d.getDay();
      const iso = isoDate(d);
      const dots = [];
      if (ws.activeDays.includes(dow)) {
        students.filter((s) => s.recurringSlot && s.recurringSlot.dayOfWeek === dow).forEach((s) => dots.push(colorForStudent(s.id)));
        students.forEach((s) => { if ((studentUnavailableMap[s.id] || []).some((u) => u.date === iso)) dots.push('#C48E93'); });
      }
      if (unavailableBlocks.some((b) => b.date === iso)) dots.push('#9aa0a8');
      return dots;
    }
    function dayDetailHtml(iso) {
      const d = new Date(iso + 'T00:00:00');
      const blocksFull = blocksForDate(d, true);
      return `
        <div class="day-detail-overlay" onclick="window.closeDayDetail()"></div>
        <div class="day-detail-panel">
          <div class="day-detail-panel-header">
            <h2 class="display" style="font-size:18px;">${d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</h2>
            <button class="ghost" onclick="window.closeDayDetail()">Close</button>
          </div>
          ${blocksFull.length === 0 ? '<p>No events.</p>' : blocksFull.map((b) => `
            <div class="day-detail-event">
              <div>${b.label}</div>
              ${b.type === 'lesson' && b.studentId
                ? (b.activeProposal
                    ? `<p style="margin:6px 0 0; font-size:12px; color:var(--ink-soft);">${b.activeProposal.turnOwner === 'teacher' ? "It's your turn — respond on the Schedule tab." : 'Waiting on the student — reschedule in progress.'}</p>`
                    : `<button class="ghost" style="margin-top:6px; padding:6px 10px; font-size:12px;" onclick="window.startRescheduleSelection('${b.studentId}', '${b.date}', '${b.startTime}')">Reschedule</button>`)
                : ''}
            </div>`).join('')}
        </div>`;
    }

    const banner = reschedulingOrigin ? `
      <div class="reschedule-banner">
        <span>Pick a new time for this lesson — tap any open slot below.</span>
        <button class="ghost" onclick="window.cancelRescheduleSelection()">Cancel</button>
      </div>` : '';

    box.innerHTML = calendarToolbarHtml() + banner + `
      <div class="calendar-legend">
        <span><span class="legend-dot" style="background:${STUDENT_COLORS[0]};"></span>Lesson (per student)</span>
        <span><span class="legend-dot" style="background:#C48E93;"></span>Student unavailable</span>
        <span><span class="legend-dot" style="background:#9aa0a8;"></span>You're unavailable</span>
        <span><span class="legend-dot" style="background:transparent; border:2px solid #A94438;"></span>⚠ Conflict</span>
      </div>
      ${state.calendarView === 'week'
        ? weekGridHtml((d) => blocksForDate(d, false), reschedulingOrigin ? null : (d) => `window.openDayDetail('${isoDate(d)}')`)
        : monthGridHtml(dotsForDate)}
      ${expandedDate ? dayDetailHtml(expandedDate) : ''}`;

    if (reschedulingOrigin) {
      box.querySelectorAll('.calendar-block.free[data-date]').forEach((elm) => {
        elm.style.cursor = 'pointer';
        elm.onclick = () => window.finalizeRescheduleSelection(elm.dataset.date, elm.dataset.starttime);
      });
    }
  }

  const unsubStudents = onSnapshot(collection(db, 'users', teacherId, 'students'), (snap) => {
    students = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    const currentIds = new Set(students.map((s) => s.id));
    students.forEach((s) => subscribeStudentExtras(s.id));
    Object.keys(studentUnavailListeners).forEach((id) => { if (!currentIds.has(id)) unsubscribeStudentExtras(id); });
    draw();
  });
  const unsubUnavail = onSnapshot(collection(db, 'users', teacherId, 'unavailableBlocks'), (snap) => {
    unavailableBlocks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    draw();
  });

  draw();
  state.unsubs.push(unsubStudents, unsubUnavail);
}

// ---------- Student: Calendar tab ----------
function renderStudentCalendarTab() {
  el.innerHTML = `
    <div class="app-shell">
      ${topbarHtml('Calendar')}
      ${renderDrawer()}
      <div id="calendar-content"><p>Loading…</p></div>
    </div>`;

  if (!state.profile.teacherId) {
    document.getElementById('calendar-content').innerHTML = '<p>Connect with your teacher first to see your calendar.</p>';
    return;
  }

  const teacherId = state.profile.teacherId;
  const uid = state.user.uid;
  let myStudentDoc = { recurringSlot: null };
  let allStudents = [];
  let weeklySchedule = null;
  let unavailableBlocks = [];
  let myProposals = [];
  let myUnavailableDates = [];
  let expandedDate = null;
  let reschedulingOrigin = null; // { date, startTime } while picking a new time

  function isTakenByAnyone(dayOfWeek, startTime) {
    return allStudents.some((s) => s.recurringSlot && s.recurringSlot.dayOfWeek === dayOfWeek && s.recurringSlot.startTime === startTime);
  }

  window.openDayDetail = function (iso) { expandedDate = iso; draw(); };
  window.closeDayDetail = function () { expandedDate = null; draw(); };
  window.startRescheduleSelection = function (originalDate, originalStartTime) {
    if (hasActiveProposal(myProposals)) return; // already one in flight
    reschedulingOrigin = { date: originalDate, startTime: originalStartTime };
    expandedDate = null;
    draw();
  };
  window.cancelRescheduleSelection = function () {
    reschedulingOrigin = null;
    draw();
  };
  window.finalizeRescheduleSelection = async function (newDate, newStartTime) {
    if (!reschedulingOrigin) return;
    const { date, startTime } = reschedulingOrigin;
    reschedulingOrigin = null;
    await createRescheduleProposal(teacherId, uid, date, startTime, 'student', newDate, newStartTime);
    draw();
  };

  function draw() {
    const box = document.getElementById('calendar-content');
    if (!box) return;
    const candidates = generateCandidateSlots(weeklySchedule);

    function blocksForDate(d, verbose) {
      const dow = d.getDay();
      const iso = isoDate(d);
      const blocks = [];
      const movedAway = myProposals.some((p) => p.status === 'confirmed' && p.originalDate === iso);
      const active = myProposals.find((p) => p.status === 'active');
      if (myStudentDoc.recurringSlot && myStudentDoc.recurringSlot.dayOfWeek === dow && !movedAway) {
        const durationMin = myStudentDoc.recurringSlot.durationMinutes || 30;
        const startMin = timeToMinutes(myStudentDoc.recurringSlot.startTime);
        const endMin = startMin + durationMin;
        const endTime = minutesToTime(endMin);
        const conflict = myUnavailableDates
          .filter((u) => u.date === iso)
          .some((u) => rangesOverlap(startMin, endMin, timeToMinutes(u.startTime), timeToMinutes(u.endTime)));
        const suffix = active ? ' (reschedule in progress)' : '';
        const label = verbose
          ? `${conflict ? '⚠ Conflict — ' : ''}Your lesson, ${formatTime12(myStudentDoc.recurringSlot.startTime)}–${formatTime12(endTime)}${suffix}`
          : `${conflict ? '⚠ ' : ''}${formatTimeCompact(myStudentDoc.recurringSlot.startTime)} Lesson`;
        blocks.push({
          type: 'lesson', color: '#8C6D3F', label, conflict,
          date: iso, startTime: myStudentDoc.recurringSlot.startTime,
          activeProposal: active || null
        });
      }
      myProposals.filter((p) => p.status === 'confirmed' && p.proposedDate === iso).forEach((p) => {
        const durationMin = (myStudentDoc.recurringSlot && myStudentDoc.recurringSlot.durationMinutes) || 30;
        const endTime = minutesToTime(timeToMinutes(p.proposedStartTime) + durationMin);
        const label = verbose
          ? `Your lesson (rescheduled), ${formatTime12(p.proposedStartTime)}–${formatTime12(endTime)}`
          : `${formatTimeCompact(p.proposedStartTime)} Lesson (moved)`;
        blocks.push({ type: 'lesson', color: '#8C6D3F', label });
      });

      if (reschedulingOrigin) {
        // Actively picking — show each open slot individually and clickable.
        const slotLen = (weeklySchedule && weeklySchedule.slotLengthMinutes) || 30;
        candidates.filter((s) => s.dayOfWeek === dow).forEach((s) => {
          const taken = isTakenByAnyone(s.dayOfWeek, s.startTime);
          const teacherBlocked = unavailableBlocks.some((b) => b.date === iso &&
            rangesOverlap(timeToMinutes(s.startTime), timeToMinutes(s.startTime) + slotLen, timeToMinutes(b.startTime), timeToMinutes(b.endTime)));
          const myBlocked = myUnavailableDates.some((u) => u.date === iso &&
            rangesOverlap(timeToMinutes(s.startTime), timeToMinutes(s.startTime) + slotLen, timeToMinutes(u.startTime), timeToMinutes(u.endTime)));
          if (!taken && !teacherBlocked && !myBlocked) {
            blocks.push({
              type: 'free', date: iso, startTime: s.startTime,
              label: verbose ? `Open — ${formatTime12(s.startTime)}` : formatTimeCompact(s.startTime),
              clickable: true
            });
          }
        });
      } else {
        const freeSlots = candidates
          .filter((s) => s.dayOfWeek === dow && !isTakenByAnyone(s.dayOfWeek, s.startTime))
          .sort((a, b) => a.startTime.localeCompare(b.startTime));
        const slotLen = (weeklySchedule && weeklySchedule.slotLengthMinutes) || 30;
        mergeFreeRanges(freeSlots, slotLen).forEach((r) => {
          const label = verbose
            ? `Teacher free, ${formatTime12(r.startTime)}–${formatTime12(r.endTime)}`
            : `${formatTimeCompact(r.startTime)}–${formatTimeCompact(r.endTime)}`;
          blocks.push({ type: 'free', label });
        });
      }
      unavailableBlocks.filter((b) => b.date === iso).forEach((b) => {
        const label = verbose
          ? `Teacher unavailable, ${formatTime12(b.startTime)}–${formatTime12(b.endTime)}`
          : `${formatTimeCompact(b.startTime)}–${formatTimeCompact(b.endTime)}`;
        blocks.push({ type: 'unavailable', label });
      });
      return blocks;
    }
    function dotsForDate(d) {
      const dow = d.getDay();
      const iso = isoDate(d);
      const dots = [];
      if (myStudentDoc.recurringSlot && myStudentDoc.recurringSlot.dayOfWeek === dow) dots.push('#8C6D3F');
      if (unavailableBlocks.some((b) => b.date === iso)) dots.push('#9aa0a8');
      return dots;
    }
    function dayDetailHtml(iso) {
      const d = new Date(iso + 'T00:00:00');
      const blocksFull = blocksForDate(d, true);
      return `
        <div class="day-detail-overlay" onclick="window.closeDayDetail()"></div>
        <div class="day-detail-panel">
          <div class="day-detail-panel-header">
            <h2 class="display" style="font-size:18px;">${d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</h2>
            <button class="ghost" onclick="window.closeDayDetail()">Close</button>
          </div>
          ${blocksFull.length === 0 ? '<p>No events.</p>' : blocksFull.map((b) => `
            <div class="day-detail-event">
              <div>${b.label}</div>
              ${b.type === 'lesson' && b.date
                ? (b.activeProposal
                    ? `<p style="margin:6px 0 0; font-size:12px; color:var(--ink-soft);">${b.activeProposal.turnOwner === 'student' ? "It's your turn — respond on the Schedule tab." : 'Waiting on your teacher — reschedule in progress.'}</p>`
                    : `<button class="ghost" style="margin-top:6px; padding:6px 10px; font-size:12px;" onclick="window.startRescheduleSelection('${b.date}', '${b.startTime}')">Reschedule</button>`)
                : ''}
            </div>`).join('')}
        </div>`;
    }

    const banner = reschedulingOrigin ? `
      <div class="reschedule-banner">
        <span>Pick a new time for your lesson — tap any open slot below.</span>
        <button class="ghost" onclick="window.cancelRescheduleSelection()">Cancel</button>
      </div>` : '';

    box.innerHTML = calendarToolbarHtml() + banner + `
      <div class="calendar-legend">
        <span><span class="legend-dot" style="background:#8C6D3F;"></span>My lesson</span>
        <span><span class="legend-dot" style="background:transparent; border:1px dashed var(--sage);"></span>Teacher free</span>
        <span><span class="legend-dot" style="background:#9aa0a8;"></span>Teacher unavailable</span>
      </div>
      ${state.calendarView === 'week'
        ? weekGridHtml((d) => blocksForDate(d, false), reschedulingOrigin ? null : (d) => `window.openDayDetail('${isoDate(d)}')`)
        : monthGridHtml(dotsForDate)}
      ${expandedDate ? dayDetailHtml(expandedDate) : ''}`;

    if (reschedulingOrigin) {
      box.querySelectorAll('.calendar-block.free[data-date]').forEach((elm) => {
        elm.style.cursor = 'pointer';
        elm.onclick = () => window.finalizeRescheduleSelection(elm.dataset.date, elm.dataset.starttime);
      });
    }
  }

  const unsubMyDoc = onSnapshot(doc(db, 'users', teacherId, 'students', uid), (snap) => {
    myStudentDoc = snap.exists() ? { recurringSlot: null, ...snap.data() } : myStudentDoc;
    draw();
  });
  const unsubAllStudents = onSnapshot(collection(db, 'users', teacherId, 'students'), (snap) => {
    allStudents = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    draw();
  });
  const unsubTeacherDoc = onSnapshot(doc(db, 'users', teacherId), (snap) => {
    weeklySchedule = snap.exists() ? snap.data().weeklySchedule : null;

  });
  const unsubUnavail = onSnapshot(collection(db, 'users', teacherId, 'unavailableBlocks'), (snap) => {
    unavailableBlocks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));

  const unsubMyUnavailableForConflict = onSnapshot(collection(db, 'users', teacherId, 'students', uid, 'unavailableDates'), (snap) => {

}

window.removeStudent = async function (studentId, studentName) {
  if (!confirm(`Remove ${studentName} from your roster? This frees up their lesson slot.`)) return;
  const teacherId = state.user.uid;
  const batch = writeBatch(db);
  batch.delete(doc(db, 'users', teacherId, 'students', studentId));
  const lessonsSnap = await getDocs(query(collection(db, 'users', teacherId, 'lessons'), where('studentId', '==', studentId)));
  lessonsSnap.forEach((d) => batch.delete(d.ref));
  const unavailSnap = await getDocs(collection(db, 'users', teacherId, 'students', studentId, 'unavailableDates'));
  unavailSnap.forEach((d) => batch.delete(d.ref));
  const proposalsSnap = await getDocs(collection(db, 'users', teacherId, 'students', studentId, 'rescheduleProposals'));
  proposalsSnap.forEach((d) => batch.delete(d.ref));
  await batch.commit();
  try {
    await updateDoc(doc(db, 'users', studentId), { teacherId: null, role: null });
  } catch (err) { /* ignore — their account may not exist anymore */ }
};

function renderTeacherHomeTab() {
  el.innerHTML = `
    <div class="app-shell">
      ${topbarHtml('Home')}
      ${renderDrawer()}
      <div id="upcoming-lessons-section"></div>
      <div id="student-requests-section"></div>
    </div>`;

  const teacherId = state.user.uid;
  let teacherUnavailableBlocks = [];
  let studentsForProposals = [];
  let studentProposalsMap2 = {};
  let studentProposalListeners2 = {};
  let studentUnavailableMap2 = {};
  let studentUnavailableListeners2 = {};
  let proposalDatePicks = {};

  function subscribeStudentProposals(studentId) {
    if (studentProposalListeners2[studentId]) return;
    const unsub = onSnapshot(collection(db, 'users', teacherId, 'students', studentId, 'rescheduleProposals'), (snap) => {
      studentProposalsMap2[studentId] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      renderStudentRequestsSection();
      renderUpcomingLessonsSection();
    });
    studentProposalListeners2[studentId] = unsub;
    state.unsubs.push(unsub);
  }
  function unsubscribeStudentProposals(studentId) {
    if (studentProposalListeners2[studentId]) {
      studentProposalListeners2[studentId]();
      delete studentProposalListeners2[studentId];
      delete studentProposalsMap2[studentId];
    }
  }
  function subscribeStudentUnavailable2(studentId) {
    if (studentUnavailableListeners2[studentId]) return;
    const unsub = onSnapshot(collection(db, 'users', teacherId, 'students', studentId, 'unavailableDates'), (snap) => {
      studentUnavailableMap2[studentId] = snap.docs.map((d) => d.data());
      renderStudentRequestsSection();
    });
    studentUnavailableListeners2[studentId] = unsub;
    state.unsubs.push(unsub);
  }
  function unsubscribeStudentUnavailable2(studentId) {
    if (studentUnavailableListeners2[studentId]) {
      studentUnavailableListeners2[studentId]();
      delete studentUnavailableListeners2[studentId];
      delete studentUnavailableMap2[studentId];
    }
  }

  function computeTeacherPickerSlotsHtml(proposalId, studentId, chosenDate) {
    if (!chosenDate) return '';
    const ws = state.profile.weeklySchedule || { activeDays: [] };
    const d = new Date(chosenDate + 'T00:00:00');
    const dow = d.getDay();
    const slotLen = ws.slotLengthMinutes || 30;
    const openSlots = generateCandidateSlots(ws).filter((s) => s.dayOfWeek === dow).filter((s) => {
      const taken = studentsForProposals.some((st) => st.id !== studentId && st.recurringSlot &&
        st.recurringSlot.dayOfWeek === s.dayOfWeek && st.recurringSlot.startTime === s.startTime);
      const blocked = teacherUnavailableBlocks.some((b) => b.date === chosenDate &&
        rangesOverlap(timeToMinutes(s.startTime), timeToMinutes(s.startTime) + slotLen, timeToMinutes(b.startTime), timeToMinutes(b.endTime)));
      const studentUnavailable = (studentUnavailableMap2[studentId] || []).some((u) => u.date === chosenDate &&
        rangesOverlap(timeToMinutes(s.startTime), timeToMinutes(s.startTime) + slotLen, timeToMinutes(u.startTime), timeToMinutes(u.endTime)));
      return !taken && !blocked && !studentUnavailable;
    });
    return openSlots.length === 0
      ? '<p>No open times that day.</p>'
      : openSlots.map((s) => `<button class="slot-chip" onclick="window.teacherSubmitProposedTime('${studentId}', '${proposalId}', '${chosenDate}', '${s.startTime}')">${formatTime12(s.startTime)}</button>`).join('');
  }

  function renderUpcomingLessonsSection() {
    const box = document.getElementById('upcoming-lessons-section');
    if (!box) return;
    const entries = [];
    studentsForProposals.forEach((s) => {
      if (!s.recurringSlot) return;
      const nextDate = nextOccurrenceDate(s.recurringSlot.dayOfWeek);
      const nextIso = isoDate(nextDate);
      const override = (studentProposalsMap2[s.id] || []).find((p) => p.status === 'confirmed' && p.originalDate === nextIso);
      let d, startTime, rescheduled;
      if (override) {
        d = new Date(override.proposedDate + 'T00:00:00');
        startTime = override.proposedStartTime;
        rescheduled = true;
      } else {
        d = nextDate;
        startTime = s.recurringSlot.startTime;
        rescheduled = false;
      }
      entries.push({ studentName: s.name, d, startTime, rescheduled });
    });
    entries.sort((a, b) => a.d - b.d || a.startTime.localeCompare(b.startTime));
    box.innerHTML = `
      <section>
        <h2>Upcoming lessons</h2>
        ${entries.length === 0 ? '<p>No lessons scheduled yet.</p>' : entries.map((e) => `
          <div class="student-row">
            <span>${e.studentName}</span>
            <span>${FULL_DAYS[e.d.getDay()].slice(0, 3)} ${e.d.getMonth() + 1}/${e.d.getDate()}, ${formatTime12(e.startTime)}${e.rescheduled ? ' (rescheduled)' : ''}</span>
          </div>`).join('')}
      </section>`;
  }

  function renderStudentRequestsSection() {
    const box = document.getElementById('student-requests-section');
    if (!box) return;
    const myTurn = [];
    studentsForProposals.forEach((s) => {
      (studentProposalsMap2[s.id] || []).filter((p) => p.status === 'active' && p.turnOwner === 'teacher')
        .forEach((p) => myTurn.push({ ...p, studentId: s.id, studentName: s.name }));
    });
    if (myTurn.length === 0) { box.innerHTML = ''; return; }
    box.innerHTML = `
      <section>
        <h2>Reschedule — your turn</h2>
        ${myTurn.map((p) => {
          if (p.mode === 'confirm') {
            return `
              <div class="request-card">
                <p style="margin:0;">${p.studentName} proposed moving the lesson (originally ${p.originalDate} at ${formatTime12(p.originalStartTime)}) to <strong>${p.proposedDate} at ${formatTime12(p.proposedStartTime)}</strong>. Does that work?</p>
                <div>
                  <button class="primary" onclick="window.teacherConfirmProposedTime('${p.studentId}', '${p.id}', true)">Yes</button>
                  <button class="ghost" onclick="window.teacherConfirmProposedTime('${p.studentId}', '${p.id}', false)">No</button>
                </div>
              </div>`;
          }
          const chosenDate = proposalDatePicks[p.id] || '';
          return `
            <div class="request-card">
              <p style="margin:0;">${p.studentName}: originally ${p.originalDate} at ${formatTime12(p.originalStartTime)}. Pick a new day and time to offer:</p>
              <input id="teacher-pick-date-${p.id}" type="date" value="${chosenDate}" onchange="window.pickTeacherProposalDate('${p.id}', '${p.studentId}', this.value)" />
              <div id="teacher-pick-slots-${p.id}" style="margin-top:6px;">${computeTeacherPickerSlotsHtml(p.id, p.studentId, chosenDate)}</div>
            </div>`;
        }).join('')}
      </section>`;
  }

  window.pickTeacherProposalDate = function (proposalId, studentId, dateStr) {
    proposalDatePicks[proposalId] = dateStr;
    const slotsBox = document.getElementById('teacher-pick-slots-' + proposalId);
    if (slotsBox) slotsBox.innerHTML = computeTeacherPickerSlotsHtml(proposalId, studentId, dateStr);
  };

  window.teacherSubmitProposedTime = async function (studentId, proposalId, date, time) {
    await submitProposedTime(teacherId, studentId, proposalId, 'teacher', date, time);
  };

  window.teacherConfirmProposedTime = async function (studentId, proposalId, accept) {
    await confirmProposedTime(teacherId, studentId, proposalId, accept);
  };

  const unsubTeacherUnavailForHome = onSnapshot(collection(db, 'users', teacherId, 'unavailableBlocks'), (snap) => {
    teacherUnavailableBlocks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderStudentRequestsSection();
  });

  const unsubStudentsForProposals = onSnapshot(collection(db, 'users', teacherId, 'students'), (snap) => {
    studentsForProposals = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    const currentIds = new Set(studentsForProposals.map((s) => s.id));
    studentsForProposals.forEach((s) => { subscribeStudentProposals(s.id); subscribeStudentUnavailable2(s.id); });
    Object.keys(studentProposalListeners2).forEach((id) => { if (!currentIds.has(id)) unsubscribeStudentProposals(id); });
    Object.keys(studentUnavailableListeners2).forEach((id) => { if (!currentIds.has(id)) unsubscribeStudentUnavailable2(id); });
    renderStudentRequestsSection();
    renderUpcomingLessonsSection();
  });

  state.unsubs.push(unsubTeacherUnavailForHome, unsubStudentsForProposals);
}
