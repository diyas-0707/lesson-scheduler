    document.getElementById('my-lesson-section').innerHTML = `
      <section><h2>Upcoming lesson</h2><p>No upcoming lesson scheduled yet — check with your teacher.</p></section>`;
    return;
  }

  const teacherId = state.profile.teacherId;
  const uid = state.user.uid;
  let myLesson = null;
  let myStudentDoc = { recurringSlot: null };
  let myUnavailableDates = [];
  let allTeacherStudents = [];
  let teacherWeeklySchedule = null;
  let teacherUnavailableBlocks = [];
  let myProposals = [];
  let proposalPickerState = {};

  function isSlotTaken(dayOfWeek, startTime) {
    return allTeacherStudents.some((s) =>
      s.id !== uid && s.recurringSlot &&
      s.recurringSlot.dayOfWeek === dayOfWeek && s.recurringSlot.startTime === startTime
    );
  }

  function candidateSlots() {
    return generateCandidateSlots(teacherWeeklySchedule);
  }

  function computeProposalSlotsHtml(proposalId, chosenDate) {
    if (!chosenDate) return '';
    const d = new Date(chosenDate + 'T00:00:00');
    const dow = d.getDay();
    const slotLen = (teacherWeeklySchedule && teacherWeeklySchedule.slotLengthMinutes) || 30;
    const slots = candidateSlots().filter((s) => s.dayOfWeek === dow && !isSlotTaken(s.dayOfWeek, s.startTime) &&
      !teacherUnavailableBlocks.some((b) => b.date === chosenDate &&
        rangesOverlap(timeToMinutes(s.startTime), timeToMinutes(s.startTime) + slotLen, timeToMinutes(b.startTime), timeToMinutes(b.endTime))) &&
      !myUnavailableDates.some((u) => u.date === chosenDate &&
        rangesOverlap(timeToMinutes(s.startTime), timeToMinutes(s.startTime) + slotLen, timeToMinutes(u.startTime), timeToMinutes(u.endTime))));
    return slots.length === 0
      ? '<p>No open times that day — try another date.</p>'
      : slots.map((s) => `<button class="slot-chip" onclick="window.studentSubmitProposedTime('${proposalId}', '${chosenDate}', '${s.startTime}')">${formatTime12(s.startTime)}</button>`).join('');
  }

  function renderProposalsSection() {
    const box = document.getElementById('reschedule-proposal-section');
    if (!box) return;
    const myTurn = myProposals.filter((p) => p.status === 'active' && p.turnOwner === 'student');
    const waitingOnTeacher = myProposals.filter((p) => p.status === 'active' && p.turnOwner === 'teacher');
    if (myTurn.length === 0 && waitingOnTeacher.length === 0) { box.innerHTML = ''; return; }
    box.innerHTML = waitingOnTeacher.map((p) => `
      <section>
        <h2>Reschedule requested</h2>
        <p>Lesson originally ${p.originalDate} at ${formatTime12(p.originalStartTime)} — waiting on your teacher.</p>
      </section>`).join('') + myTurn.map((p) => {
      if (p.mode === 'confirm') {
        return `
          <section>
            <h2>Reschedule — your turn</h2>
            <p>Your teacher proposed moving the lesson (originally ${p.originalDate} at ${formatTime12(p.originalStartTime)}) to <strong>${p.proposedDate} at ${formatTime12(p.proposedStartTime)}</strong>. Does that work?</p>
            <div style="display:flex; gap:8px;">
              <button class="primary" onclick="window.studentConfirmProposedTime('${p.id}', true)">Yes</button>
              <button class="ghost" onclick="window.studentConfirmProposedTime('${p.id}', false)">No</button>
            </div>
          </section>`;
      }
      const chosenDate = proposalPickerState[p.id] || '';
      return `
        <section>
          <h2>Reschedule needed</h2>
          <p>Your lesson on ${p.originalDate} at ${formatTime12(p.originalStartTime)} needs to move. Pick a new day and time:</p>
          <input id="proposal-date-${p.id}" type="date" value="${chosenDate}" onchange="window.pickProposalDate('${p.id}', this.value)" />
          <div id="proposal-slots-${p.id}" style="margin-top:10px;">${computeProposalSlotsHtml(p.id, chosenDate)}</div>
        </section>`;
    }).join('');
  }

  window.pickProposalDate = function (proposalId, dateStr) {
    proposalPickerState[proposalId] = dateStr;
    // Only refresh the slot list — never the date input itself, or it loses
    // focus mid-typing (this was cutting off year entry after one digit).
    const slotsBox = document.getElementById('proposal-slots-' + proposalId);
    if (slotsBox) slotsBox.innerHTML = computeProposalSlotsHtml(proposalId, dateStr);
  };

  window.studentSubmitProposedTime = async function (proposalId, date, time) {
    await submitProposedTime(teacherId, uid, proposalId, 'student', date, time);
  };

  window.studentConfirmProposedTime = async function (proposalId, accept) {
    await confirmProposedTime(teacherId, uid, proposalId, accept);
  };

  function renderMyLessonSection() {
    const box = document.getElementById('my-lesson-section');
    if (!box) return;
    let line;
    if (myLesson) {
      line = `${myLesson.date} at ${formatTime12(myLesson.startTime)}${myLesson.status === 'pending_reschedule' ? ' (reschedule pending teacher approval)' : ''}`;
    } else if (myStudentDoc.recurringSlot) {
      const nextDate = nextOccurrenceDate(myStudentDoc.recurringSlot.dayOfWeek);
      const nextIso = isoDate(nextDate);
      const override = myProposals.find((p) => p.status === 'confirmed' && p.originalDate === nextIso);
      if (override) {
        const d = new Date(override.proposedDate + 'T00:00:00');
        const dateStr = `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;
        line = `Lesson on ${FULL_DAYS[d.getDay()]}, ${dateStr} at ${formatTime12(override.proposedStartTime)} (rescheduled)`;
      } else {
        line = formatUpcomingLessonLine(myStudentDoc.recurringSlot.dayOfWeek, myStudentDoc.recurringSlot.startTime);
      }
    } else {
      line = null;
    }
    box.innerHTML = `
      <section>
        <h2>Upcoming lesson</h2>
        ${line ? `<p>${line}</p>` : `<p>No upcoming lesson scheduled yet — check with your teacher.</p>`}
      </section>`;
  }

  const unsubMyDoc = onSnapshot(doc(db, 'users', teacherId, 'students', uid), (snap) => {
    myStudentDoc = snap.exists() ? { recurringSlot: null, ...snap.data() } : myStudentDoc;
    renderMyLessonSection();
  });

  const unsubMyUnavailable = onSnapshot(collection(db, 'users', teacherId, 'students', uid, 'unavailableDates'), (snap) => {
    myUnavailableDates = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  });

  const unsubTeacherDoc = onSnapshot(doc(db, 'users', teacherId), (snap) => {
    teacherWeeklySchedule = snap.exists() ? snap.data().weeklySchedule : null;
  });

  const unsubAllStudents = onSnapshot(collection(db, 'users', teacherId, 'students'), (snap) => {
    allTeacherStudents = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  });

  const lessonsQ = query(collection(db, 'users', teacherId, 'lessons'), where('studentId', '==', uid));
  const unsubLesson = onSnapshot(lessonsQ, (snap) => {
    const upcoming = snap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .filter((l) => l.status !== 'cancelled')
      .sort((a, b) => new Date(a.date) - new Date(b.date))[0];
    myLesson = upcoming || null;
    renderMyLessonSection();
  });

  const unsubUnavailableBlocks = onSnapshot(collection(db, 'users', teacherId, 'unavailableBlocks'), (snap) => {
    teacherUnavailableBlocks = snap.docs.map((d) => ({ id: d.id, ...d.data() }));

    const todayStr = new Date().toISOString().slice(0, 10);
    const upcoming = teacherUnavailableBlocks
      .filter((b) => b.date >= todayStr)
      .sort((a, b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime));
    const box = document.getElementById('teacher-unavailable-section');
    if (box) {
      box.innerHTML = upcoming.length === 0 ? '' : `
        <section>
          <h2>Your teacher is unavailable</h2>
          ${upcoming.map((b) => `<p style="margin:0 0 4px;">${b.date}, ${formatTime12(b.startTime)}–${formatTime12(b.endTime)}</p>`).join('')}
        </section>`;
    }
  });

  const unsubProposals = onSnapshot(collection(db, 'users', teacherId, 'students', uid, 'rescheduleProposals'), (snap) => {
    myProposals = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderProposalsSection();
    renderMyLessonSection();
  });

  state.unsubs.push(unsubMyDoc, unsubMyUnavailable, unsubTeacherDoc, unsubAllStudents, unsubLesson, unsubUnavailableBlocks, unsubProposals);
}

function renderStudentScheduleTab() {
  el.innerHTML = `
    <div class="app-shell">
      ${topbarHtml('Schedule')}
      ${renderDrawer()}
      <div id="lesson-time-section"></div>
      <div id="unavailable-section"></div>
      <div id="reschedule-picker-section"></div>
    </div>`;

  if (!state.profile.teacherId) {
    document.getElementById('lesson-time-section').innerHTML = `
      <section><h2>Choose your lesson time</h2><p>Connect with your teacher first.</p></section>`;
    return;
  }

  const teacherId = state.profile.teacherId;
  const uid = state.user.uid;
  let myLesson = null;
  let myStudentDoc = { recurringSlot: null };
  let myUnavailableDates = [];
  let allTeacherStudents = [];
  let teacherWeeklySchedule = null;
  let showSlotPicker = false;
  let pickerDay = null;
  let reschedulePickerDay = null;

  function isSlotTaken(dayOfWeek, startTime) {
    return allTeacherStudents.some((s) =>
      s.id !== uid && s.recurringSlot &&
      s.recurringSlot.dayOfWeek === dayOfWeek && s.recurringSlot.startTime === startTime
    );
  }

  function candidateSlots() {
    return generateCandidateSlots(teacherWeeklySchedule);
  }

  function renderLessonTimeSection() {
    const box = document.getElementById('lesson-time-section');
    if (!box) return;

    if (myStudentDoc.recurringSlot && !showSlotPicker) {
      box.innerHTML = `
        <section>
          <h2>Your weekly lesson time</h2>
          <p class="current-slot">${DAYS[myStudentDoc.recurringSlot.dayOfWeek]} at ${formatTime12(myStudentDoc.recurringSlot.startTime)}</p>
          <button class="ghost" onclick="window.toggleSlotPicker()">Change time</button>
        </section>`;
      return;
    }

    const activeDays = (teacherWeeklySchedule && teacherWeeklySchedule.activeDays) || [];
    const daySlots = pickerDay === null ? [] : candidateSlots().filter((s) => s.dayOfWeek === pickerDay);

    const openDaySlots = daySlots.filter((s) => !isSlotTaken(s.dayOfWeek, s.startTime));
    box.innerHTML = `
      <section>
        <h2>Choose your lesson time</h2>
        <p>Pick a day, then a time.</p>
        <div class="day-pills">
          ${DAY_LETTERS.map((letter, i) => `
            <button type="button" class="day-pill ${pickerDay === i ? 'selected' : ''} ${activeDays.includes(i) ? '' : 'disabled'}"
              ${activeDays.includes(i) ? `onclick="window.pickLessonDay(${i})"` : 'disabled'}>${letter}</button>`).join('')}
        </div>
        ${pickerDay === null
          ? '<p>Select a highlighted day above to see open times.</p>'
          : openDaySlots.length === 0
            ? '<p>No open times on that day.</p>'
            : openDaySlots.map((s) => `<button class="slot-chip" onclick="window.chooseLessonSlot(${s.dayOfWeek}, '${s.startTime}')">${formatTime12(s.startTime)}</button>`).join('')}
        ${myStudentDoc.recurringSlot ? `<div style="margin-top:10px;"><button class="ghost" onclick="window.toggleSlotPicker()">Cancel</button></div>` : ''}
      </section>`;
  }

  function renderUnavailableSection() {
    const box = document.getElementById('unavailable-section');
    if (!box) return;
    const sorted = myUnavailableDates.slice().sort((a, b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime));
    box.innerHTML = `
      <section>
        <h2>Days you're not available</h2>
        <p>Let your teacher know ahead of time which dates and times you'll miss.</p>
        <form class="inline" onsubmit="window.addUnavailableDate(event)">
          <input id="unavailable-date-input" type="date" required />
          <input id="unavailable-start-input" type="time" required />
          <input id="unavailable-end-input" type="time" required />
          <button class="ghost" type="submit">Add</button>
        </form>
        ${sorted.length === 0 ? '' : sorted.map((e) => `
          <div class="student-row">
            <span>${e.date}, ${formatTime12(e.startTime)}–${formatTime12(e.endTime)}</span>
            <button class="danger-link" onclick="window.removeUnavailableDate('${e.id}')">Remove</button>
          </div>`).join('')}
      </section>`;
  }

  window.toggleSlotPicker = function () {
    showSlotPicker = !showSlotPicker;
    pickerDay = null;
    renderLessonTimeSection();
  };

  window.pickLessonDay = function (dayIndex) {
    pickerDay = dayIndex;
    renderLessonTimeSection();
  };

  window.chooseLessonSlot = async function (dayOfWeek, startTime) {
    await updateDoc(doc(db, 'users', teacherId, 'students', uid), {
      recurringSlot: { dayOfWeek, startTime, durationMinutes: (teacherWeeklySchedule && teacherWeeklySchedule.slotLengthMinutes) || 30 }
    });
    myStudentDoc = { ...myStudentDoc, recurringSlot: { dayOfWeek, startTime } };
    showSlotPicker = false;
    pickerDay = null;
    renderLessonTimeSection();
  };

  let addingUnavailableDate = false;
  window.addUnavailableDate = async function (e) {
    e.preventDefault();
    if (addingUnavailableDate) return;
    const date = document.getElementById('unavailable-date-input').value;
    const startTime = document.getElementById('unavailable-start-input').value;
    const endTime = document.getElementById('unavailable-end-input').value;
    if (!date || !startTime || !endTime) return;
    const isDuplicate = myUnavailableDates.some((d) => d.date === date && d.startTime === startTime && d.endTime === endTime);
    if (isDuplicate) return;
    addingUnavailableDate = true;
    try {
      await addDoc(collection(db, 'users', teacherId, 'students', uid, 'unavailableDates'), { date, startTime, endTime });
    } finally {
      addingUnavailableDate = false;
    }
  };

  window.removeUnavailableDate = async function (entryId) {
    await deleteDoc(doc(db, 'users', teacherId, 'students', uid, 'unavailableDates', entryId));
  };

  const unsubMyDoc = onSnapshot(doc(db, 'users', teacherId, 'students', uid), (snap) => {
    myStudentDoc = snap.exists() ? { recurringSlot: null, ...snap.data() } : myStudentDoc;
    renderLessonTimeSection();
  });

  const unsubMyUnavailable = onSnapshot(collection(db, 'users', teacherId, 'students', uid, 'unavailableDates'), (snap) => {
    myUnavailableDates = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderUnavailableSection();
  });

  const unsubTeacherDoc = onSnapshot(doc(db, 'users', teacherId), (snap) => {
    teacherWeeklySchedule = snap.exists() ? snap.data().weeklySchedule : null;
    renderLessonTimeSection();
    renderReschedulePicker();
  });

  const unsubAllStudents = onSnapshot(collection(db, 'users', teacherId, 'students'), (snap) => {
    allTeacherStudents = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    renderLessonTimeSection();
  });

  const lessonsQ = query(collection(db, 'users', teacherId, 'lessons'), where('studentId', '==', uid));
  const unsubLesson = onSnapshot(lessonsQ, (snap) => {
    const upcoming = snap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .filter((l) => l.status !== 'cancelled')
      .sort((a, b) => new Date(a.date) - new Date(b.date))[0];
    myLesson = upcoming || null;
    renderReschedulePicker();
  });

  function renderReschedulePicker() {
    const box = document.getElementById('reschedule-picker-section');
    if (!box) return;
    if (!myLesson) { box.innerHTML = ''; return; }
    const activeDays = (teacherWeeklySchedule && teacherWeeklySchedule.activeDays) || [];
    const openDaySlots = reschedulePickerDay === null ? [] : candidateSlots().filter((s) => s.dayOfWeek === reschedulePickerDay && !isSlotTaken(s.dayOfWeek, s.startTime));
    box.innerHTML = `
      <section>
        <h2>Reschedule this lesson</h2>
        <p>Pick a new day and time to move your upcoming lesson into:</p>
        <div class="day-pills">
          ${DAY_LETTERS.map((letter, i) => `
            <button type="button" class="day-pill ${reschedulePickerDay === i ? 'selected' : ''} ${activeDays.includes(i) ? '' : 'disabled'}"
              ${activeDays.includes(i) ? `onclick="window.pickRescheduleDay(${i})"` : 'disabled'}>${letter}</button>`).join('')}
        </div>
        ${reschedulePickerDay === null
          ? ''
          : openDaySlots.length === 0
            ? '<p>No open times on that day.</p>'
            : openDaySlots.map((s) => `<button class="slot-chip" onclick="window.handleReschedule('${s.startTime}')">${formatTime12(s.startTime)}</button>`).join('')}
      </section>`;
  }

  window.pickRescheduleDay = function (dayIndex) {
    reschedulePickerDay = dayIndex;
    renderReschedulePicker();
  };

  window.handleReschedule = async function (toStartTime) {
    if (!myLesson) return;
    const result = await requestReschedule({
      teacherId, studentId: uid, studentName: state.profile.name,
      lessonId: myLesson.id, fromDate: myLesson.date, fromStartTime: myLesson.startTime,
      toDate: myLesson.date, toStartTime
    });
    alert(result.autoApplied ? 'Lesson moved!' : "Sent to your teacher for approval — you're close to the cutoff window.");
  };

  renderLessonTimeSection();
  renderUnavailableSection();

  state.unsubs.push(unsubMyDoc, unsubMyUnavailable, unsubTeacherDoc, unsubAllStudents, unsubLesson);
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => { /* installability is best-effort */ });
  });
}
</script>
</body>
</html>
